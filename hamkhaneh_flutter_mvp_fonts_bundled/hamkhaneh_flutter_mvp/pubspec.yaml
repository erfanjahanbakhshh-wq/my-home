name: hamkhaneh
description: اپ مدیریت خانه‌های چندخانواره هم‌خانه
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  intl: ^0.19.0
  shamsi_date: ^1.0.2
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
    - family: Gandom
      fonts:
        - asset: assets/fonts/Gandom-FD.ttf
          weight: 400
    - family: Sahel
      fonts:
        - asset: assets/fonts/Sahel-Bold.ttf
          weight: 700
