name: hamkhaneh
description: اپ مدیریت خانه خونمون با PocketBase
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  pocketbase: ^0.23.0
  intl: ^0.19.0
  shamsi_date: ^1.0.2
  image_picker: ^1.1.2
  http: ^1.2.2
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true
  assets:
    - assets/branding/hamkhaneh_logo.png
    - assets/fonts/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Medium.ttf
    - family: Gandom
      fonts:
        - asset: assets/fonts/Gandom-FD.ttf
    - family: Sahel
      fonts:
        - asset: assets/fonts/Sahel-Bold.ttf

# Generate Android launcher assets after an Android platform is added.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/hamkhaneh_logo.png
  adaptive_icon_background: "#137C72"
  adaptive_icon_foreground: assets/branding/hamkhaneh_logo.png
